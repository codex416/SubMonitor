services:
  php:
    image: php:8.2-fpm-alpine
    container_name: submonitor-php
    restart: always
    volumes:
      - ./html:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./rules:/etc/nginx/rules
      - ./rules:/var/www/html/rules
      - log-data:/var/log/nginx

  nginx:
    image: nginx:alpine
    container_name: submonitor-nginx
    restart: always
    ports:
      - "80:80"     # HTTP 端口
      - "443:443"   # HTTPS 端口
    volumes:
      - ./html:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./rules:/etc/nginx/rules
      - ./ssl:/etc/nginx/ssl
      - ./entrypoint.sh:/entrypoint.sh
      - log-data:/var/log/nginx
    depends_on:
      - php
    entrypoint: ["/entrypoint.sh"]

volumes:
  log-data:
