services:
  php:
    image: php:8.2-fpm-alpine
    container_name: submonitor-php
    user: root # 1. 赋予 root 权限，解决 Alpine 下 FPM 无权修改挂载文件的问题
    restart: always
    volumes:
      - ./html:/var/www/html
      - ./nginx:/etc/nginx/conf.d # 2. 改为挂载整个目录，解决单文件无法覆写问题
      - ./rules:/etc/nginx/rules
      - ./rules:/var/www/html/rules
      - ./ssl:/etc/nginx/ssl # 3. 补上 SSL 挂载，让 PHP 能读取到证书文件
      - log-data:/var/log/nginx

  nginx:
    image: nginx:alpine
    container_name: submonitor-nginx
    restart: always
    ports:
      - "80:80" # HTTP 端口
      - "443:443" # HTTPS 端口
    volumes:
      - ./html:/var/www/html
      - ./nginx:/etc/nginx/conf.d # 2. 保持与 PHP 挂载目录一致
      - ./rules:/etc/nginx/rules
      - ./ssl:/etc/nginx/ssl
      - ./entrypoint.sh:/entrypoint.sh
      - log-data:/var/log/nginx
    depends_on:
      - php
    entrypoint: ["/entrypoint.sh"]

volumes:
  log-data:
