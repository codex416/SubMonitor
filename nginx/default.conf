server {
    listen 80;
    listen [::]:80;
    server_name test.befriends.wiki;

    # ACME HTTP-01 证书自动化验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # HTTP 重定向至 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test.befriends.wiki;

    # 获取客户端真实 IP（防止 Docker 虚拟网卡覆盖真实 IP 导致封禁失效）
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # SSL 证书文件挂载路径
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # 安全加密协议
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/html;
    index index.html index.php;

    # Dashboard 静态文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP 后端处理
    location ~ \.php$ {
        fastcgi_pass submonitor-php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 机场订阅代理接口与黑名单防护
    location /befriends {
        include /etc/nginx/rules/ip_blacklist.conf;
        include /etc/nginx/rules/ua_blacklist.conf;
        include /etc/nginx/rules/token_blacklist.conf;

        access_log /var/log/nginx/sub_access.log;

        proxy_pass https://befriends.one;
        proxy_set_header Host befriends.one;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name befriends.one;

        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_cache off;
    }
}
