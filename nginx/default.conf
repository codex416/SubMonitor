server {
    listen 80;
    server_name localhost;

    # 原有的前端 Dashboard 和日志 API 匹配
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/logs {
        proxy_pass http://submonitor-backend:5000/api/logs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 机场订阅代理接口
    location /befriends {
        # 使用默认日志格式（去掉了末尾的 sub_monitor）
        access_log /var/log/nginx/sub_access.log;

        proxy_pass https://befriends.one;
        proxy_set_header Host befriends.one;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name befriends.one;

        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_cache off;
    }
}
