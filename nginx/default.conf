# ====================================================
# 日志过滤映射：带 token 参数才记录
# ====================================================
map $arg_token $loggable {
    default 0;
    "~."    1;
}

# ----------------------------------------------------
# 80 端口：处理验证，拦截 IP 或跳转域名
# ----------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/SubMonitor/html;
    index index.html login.html index.php;

    # 信任 Docker 网关及 IPv6 内网段，用于还原真实访客 IP
    set_real_ip_from 172.18.0.0/16;
    set_real_ip_from 2001:db8:1::/64;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 必须最优先：供验证使用，绝对不能 301 跳转
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /opt/SubMonitor/html;
        allow all;
    }

    # 如果是通过纯 IPv4 访问 80，直接无任何响应
    if ($host ~* "^\d+\.\d+\.\d+\.\d+$") {
        return 444; 
    }
    # 如果是通过纯 IPv6 访问 80（包含冒号），直接无任何响应
    if ($host ~* ":") {
        return 444; 
    }

    # 正常域名访问则自动跳转 HTTPS
    location / {
        return 301 https://$http_host$request_uri;
    }
}

# ----------------------------------------------------
# 443 端口：加密访问与反向代理
# ----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    root /opt/SubMonitor/html;
    index index.html login.html index.php;

    # 信任 Docker 网关及 IPv6 内网段，用于还原真实访客 IP
    set_real_ip_from 172.18.0.0/16;
    set_real_ip_from 2001:db8:1::/64;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 核心：如果是通过纯 IPv4 访问 443，直接无任何响应
    if ($host ~* "^\d+\.\d+\.\d+\.\d+$") {
        return 444;
    }
    # 核心：如果是通过纯 IPv6 访问 443（包含冒号），直接无任何响应
    if ($host ~* ":") {
        return 444;
    }

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /opt/SubMonitor/html;
        allow all;
    }

    access_log /opt/SubMonitor/rules/access.log combined if=$loggable;
    error_log /opt/SubMonitor/rules/error.log;

    include /opt/SubMonitor/rules/ip_blacklist.conf;
    include /opt/SubMonitor/rules/ua_blacklist.conf;
    include /opt/SubMonitor/rules/token_blacklist.conf;

    # 核心修正：优先匹配本地文件，其次走 PHP 或走反向代理 @proxy
    location / {
        try_files $uri $uri/ @proxy;
    }

    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    location @proxy {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $backend_url "https://your-target-domain.com"; # 请根据实际情况替换目标反代域名
        proxy_pass $backend_url;
        
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_ssl_server_name on;
    }

    location ~ /\. {
        deny all;
    }
}
