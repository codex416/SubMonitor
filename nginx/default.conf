# ====================================================
# 日志过滤映射：带 token 参数才记录
# ====================================================
map $arg_token $loggable {
    default 0;
    "~."    1;
}

# ----------------------------------------------------
# 80 端口服务：处理常规访问、ACME 证书验证
# ----------------------------------------------------
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html login.html index.php;

    # ACME 验证目录（必须保留，供面板申请和续签证书）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    access_log /etc/nginx/rules/access.log combined if=$loggable;
    error_log /etc/nginx/rules/error.log;

    include /etc/nginx/rules/ip_blacklist.conf;
    include /etc/nginx/rules/ua_blacklist.conf;
    include /etc/nginx/rules/token_blacklist.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # 动态反代目标配置
    location @proxy {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $backend_url "https://127.0.0.1";
        if ($env_backend_url != "") {
            set $backend_url $env_backend_url;
        }
        proxy_pass $backend_url;
        
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_ssl_server_name on;
    }

    location ~ /\. {
        deny all;
    }
}

# ----------------------------------------------------
# 443 端口服务：仅在证书申请成功后自动生效并接管流量
# ----------------------------------------------------
server {
    listen 443 ssl;
    server_name _;

    root /var/www/html;
    index index.html login.html index.php;

    # 自动匹配你的域名证书路径（只需把 yourdomain.com 换成你的域名）
    ssl_certificate /root/.acme.sh/yourdomain.com_ecc/yourdomain.com.cer;
    ssl_certificate_key /root/.acme.sh/yourdomain.com_ecc/yourdomain.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /etc/nginx/rules/access.log combined if=$loggable;
    error_log /etc/nginx/rules/error.log;

    include /etc/nginx/rules/ip_blacklist.conf;
    include /etc/nginx/rules/ua_blacklist.conf;
    include /etc/nginx/rules/token_blacklist.conf;

    # 核心：当用户通过 IP 访问 443 时，或者通过 HTTP 进来时，可在此处强制跳转到域名
    # 如果你希望通过 IP 访问 443 时也强制跳到域名，可以开启下面这行：
    # if ($host != "yourdomain.com") { return 301 https://yourdomain.com$request_uri; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    location @proxy {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $backend_url "https://127.0.0.1";
        if ($env_backend_url != "") {
            set $backend_url $env_backend_url;
        }
        proxy_pass $backend_url;
        
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_ssl_server_name on;
    }

    location ~ /\. {
        deny all;
    }
}
