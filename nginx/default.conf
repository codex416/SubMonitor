# ====================================================
# 日志过滤映射：带 token 参数才记录
# ====================================================
map $arg_token $loggable {
    default 0;
    "~."    1;
}

# ----------------------------------------------------
# HTTP 服务 (端口 80)：处理常规访问、重定向以及 ACME 证书续签验证
# ----------------------------------------------------
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html login.html index.php;

    # ACME 验证目录（必须保留，供证书申请与续签使用）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    access_log /etc/nginx/rules/access.log combined if=$loggable;
    error_log /etc/nginx/rules/error.log;

    include /etc/nginx/rules/ip_blacklist.conf;
    include /etc/nginx/rules/ua_blacklist.conf;
    include /etc/nginx/rules/token_blacklist.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }
}

# ----------------------------------------------------
# HTTPS 服务 (端口 443)：处理加密访问与反向代理
# ----------------------------------------------------
server {
    listen 443 ssl;
    server_name _;

    root /var/www/html;
    index index.html login.html index.php;

    # SSL 证书路径配置（请确保面板或手动生成的证书挂载到此路径）
    ssl_certificate /etc/nginx/cert/fullchain.cer;
    ssl_certificate_key /etc/nginx/cert/yourdomain.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /etc/nginx/rules/access.log combined if=$loggable;
    error_log /etc/nginx/rules/error.log;

    include /etc/nginx/rules/ip_blacklist.conf;
    include /etc/nginx/rules/ua_blacklist.conf;
    include /etc/nginx/rules/token_blacklist.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # 动态反代目标配置（由面板或变量控制目标地址）
    location @proxy {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        # 如果未设置环境变量，默认转发到本地或安全占位地址，防止 Nginx 启动报错
        set $backend_url "https://127.0.0.1";
        if ($env_backend_url != "") {
            set $backend_url $env_backend_url;
        }
        proxy_pass $backend_url;
        
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_ssl_server_name on;
    }

    location ~ /\. {
        deny all;
    }
}
