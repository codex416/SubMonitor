# ====================================================
# 日志过滤映射：带 token 参数才记录
# ====================================================
map $arg_token $loggable {
    default 0;
    "~."    1;
}

# ----------------------------------------------------
# 修正版：本地文件优先 + login.html 优先 + 代理仅兜底
# ----------------------------------------------------
server {
    listen 80;
    server_name _;

    root /var/www/html;
    # ✅ 优先顺序：index.html → login.html → index.php
    index index.html login.html index.php;

    # ACME 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    access_log /etc/nginx/rules/access.log combined if=$loggable;
    error_log /etc/nginx/rules/error.log;

    include /etc/nginx/rules/ip_blacklist.conf;
    include /etc/nginx/rules/ua_blacklist.conf;
    include /etc/nginx/rules/token_blacklist.conf;

    # ✅ 本地文件存在就直接返回，不存在才走代理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ✅ PHP 请求转发到 PHP 容器
    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # 仅兜底：文件完全不存在时才代理（平时不会触发）
    location @proxy {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $backend_target "https://backend.example.com";
        proxy_pass $backend_target;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_ssl_server_name on;
        proxy_ssl_name $http_host;
    }

    location ~ /\. {
        deny all;
    }
}
