log_format sub_monitor '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

# 限流区域：单个 IP 每分钟最多 20 次请求
limit_req_zone $binary_remote_addr zone=sub_limit:10m rate=20r/m;

# 映射 Token 黑名单
map $arg_token $blocked_token {
    default 0;
    include /etc/nginx/rules/token_blacklist.conf;
}

# 映射 恶意 UA 拦截
map $http_user_agent $blocked_ua {
    default 0;
    "~*curl" 1;
    "~*wget" 1;
    "~*python" 1;
    "~*Go-http-client" 1;
    include /etc/nginx/rules/ua_blacklist.conf;
}

server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.html;

    # 订阅代理拦截与防护入口
    location /api/v1/client/subscribe {
        access_log /var/log/nginx/sub_access.log sub_monitor;

        # 校验 1: IP 黑名单拦截
        include /etc/nginx/rules/ip_blacklist.conf;

        # 校验 2: Token 黑名单拦截
        if ($blocked_token = 1) {
            return 403;
        }

        # 校验 3: 恶意 UA 拦截
        if ($blocked_ua = 1) {
            return 403;
        }

        # 校验 4: 速率限制
        limit_req zone=sub_limit burst=5 nodelay;

        # 反向代理至实际机场后端 (替换为你的真实域名)
        proxy_pass https://befriends.one;
        proxy_set_header Host befriends.one;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # 前端监控看板
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP 后端 API
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
