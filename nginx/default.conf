# ----------------------------------------------------
# HTTP 服务：处理 ACME 证书验证及 301 重定向
# ----------------------------------------------------
server {
    listen 80;
    server_name test.befriends.wiki;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------
# HTTPS 服务：主应用与 API 反向代理
# ----------------------------------------------------
server {
    listen 443 ssl;
    server_name test.befriends.wiki;

    # 解决 400 错误
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/html;
    index index.php index.html;

    # 显式绑定标准访问日志路径，确保 PHP 能百分之百读取
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    include /etc/nginx/rules/ip_blacklist.conf;
    include /etc/nginx/rules/ua_blacklist.conf;
    include /etc/nginx/rules/token_blacklist.conf;

    # 1. 静态资源直接读取
    location /assets/ {
        try_files $uri =404;
    }

    # 2. PHP 文件交由 PHP-FPM 处理
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # 3. 后台管理面板 API 路由
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. 根目录智能分流（带 token 走反代，不带 token 走本地面板）
    location / {
        if ($arg_token != "") {
            proxy_pass https://127.0.0.1;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_ssl_name 127.0.0.1;
            break;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\. {
        deny all;
    }
}
