# ----------------------------------------------------
# HTTP 服务：处理 ACME 证书验证及 301 重定向
# ----------------------------------------------------
server {
    listen 80;
    server_name test.befriends.wiki;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------
# HTTPS 服务：主应用与 API 反向代理
# ----------------------------------------------------
server {
    listen 443 ssl;
    server_name test.befriends.wiki;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/html;
    index index.php index.html;

    access_log /etc/nginx/rules/access.log;
    error_log /etc/nginx/rules/error.log;

    include /etc/nginx/rules/ip_blacklist.conf;
    include /etc/nginx/rules/ua_blacklist.conf;
    include /etc/nginx/rules/token_blacklist.conf;

    location / {
        try_files $uri $uri/ @proxy;
    }

    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # 反向代理配置块（静态直连，后台面板可以直接完美读写修改此处的域名）
    location @proxy {
        proxy_pass https://befriends.one; # 后台修改域名时会自动替换这里的域名
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
    }

    location ~ /\. {
        deny all;
    }
}
