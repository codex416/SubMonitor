# ====================================================
# 日志过滤映射：带 token 参数才记录
# ====================================================
map $arg_token $loggable {
    default 0;
    "~."    1;
}

# 正式 SSL 成功后，由 action/entrypoint 写入授权域名。
# domain_lock.conf 必须先定义 $domain_locked。
include /opt/SubMonitor/rules/domain_lock.conf;

map $host $domain_allowed {
    default 0;
    include /opt/SubMonitor/rules/domain_allow.conf;
}

# 访问锁定状态文件生成的 Nginx map。
# 初始安装为 0；正式证书成功后为 1。
map $request_uri $is_acme_challenge {
    default 0;
    ~^/\.well-known/acme-challenge/ 1;
}

# 将锁定状态与 Host 权限合并：
# 0 = 未锁定，全部允许；1 = 已锁定，仅授权域名允许。
map "$domain_locked:$domain_allowed:$is_acme_challenge" $deny_when_locked {
    default 0;
    "1:0:0" 1;
}

map "$domain_locked:$domain_allowed" $force_https {
    default 0;
    "1:1" 1;
}


server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/SubMonitor/html;
    index index.php;

    # ====================================================
    # Real IP：Docker 内网
    # ====================================================
    set_real_ip_from 172.18.0.0/16;
    set_real_ip_from 2001:db8:1::/64;
    set_real_ip_from fc00::/7;

    # ====================================================
    # Real IP：Cloudflare IPv4
    # ====================================================
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # ====================================================
    # Real IP：Cloudflare IPv6
    # ====================================================
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ACME HTTP-01 始终允许。
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /opt/SubMonitor/html;
        allow all;
    }

    if ($deny_when_locked = 1) {
        return 444;
    }

    if ($force_https = 1) {
        return 301 https://$host$request_uri;
    }

    # 初始阶段：IP/域名都可访问；
    # 锁定阶段授权域名由上面的规则跳 HTTPS。
    location / {
        try_files $uri $uri/ @proxy;
    }

    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    location @proxy {
        resolver 8.8.8.8 1.1.1.1 valid=30s;

        set $backend_url "https://example.com";

        proxy_pass $backend_url;

        proxy_set_header Host $proxy_host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
    }

    location ~ /\. {
        deny all;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    root /opt/SubMonitor/html;
    index index.php;

    # ====================================================
    # Real IP：Docker 内网
    # ====================================================
    set_real_ip_from 172.18.0.0/16;
    set_real_ip_from 2001:db8:1::/64;
    set_real_ip_from fc00::/7;

    # ====================================================
    # Real IP：Cloudflare IPv4
    # ====================================================
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # ====================================================
    # Real IP：Cloudflare IPv6
    # ====================================================
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /opt/SubMonitor/html;
        allow all;
    }

    if ($deny_when_locked = 1) {
        return 444;
    }

    access_log /opt/SubMonitor/rules/access.log combined if=$loggable;

    error_log /opt/SubMonitor/rules/error.log;

    include /opt/SubMonitor/rules/ip_blacklist.conf;

    include /opt/SubMonitor/rules/ua_blacklist.conf;

    include /opt/SubMonitor/rules/token_blacklist.conf;

    location / {
        try_files $uri $uri/ @proxy;
    }

    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    location @proxy {
        resolver 8.8.8.8 1.1.1.1 valid=30s;

        set $backend_url "https://example.com";

        proxy_pass $backend_url;

        proxy_set_header Host $proxy_host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
    }

    location ~ /\. {
        deny all;
    }
}
