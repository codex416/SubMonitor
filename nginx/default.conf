# ----------------------------------------------------
# 初始默认配置：支持 IP 直接访问，永不因域名或后端解析失败而崩溃
# ----------------------------------------------------
server {
    listen 80;
    server_name _; # 匹配所有 IP 或未绑定域名的访问

    root /var/www/html;
    index index.php index.html;

    # Let's Encrypt 证书申请验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 显式将日志输出到双端共享的 rules 目录
    access_log /etc/nginx/rules/access.log;
    error_log /etc/nginx/rules/error.log;

    # 引入动态黑名单规则
    include /etc/nginx/rules/ip_blacklist.conf;
    include /etc/nginx/rules/ua_blacklist.conf;
    include /etc/nginx/rules/token_blacklist.conf;

    # 主站点路由：本地找不到文件时回退到 @proxy 代理
    location / {
        try_files $uri $uri/ @proxy;
    }

    # PHP-FPM 请求转发至后端 submonitor-php 容器
    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # 反向代理配置块（加入 resolver 动态解析，防止启动时因后端域名解析不到而崩溃）
    location @proxy {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $backend_target "https://backend.example.com"; # 初始占位符，后续可在后台随时修改
        proxy_pass $backend_target;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_ssl_server_name on;
        proxy_ssl_name $http_host;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
