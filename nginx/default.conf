# ====================================================
# 日志过滤映射：带 token 参数才记录
# ====================================================
map $arg_token $loggable {
    default 0;
    "~."    1;
}

# ----------------------------------------------------
# 修正版：用变量延迟解析域名 → Nginx 启动不报错
# ----------------------------------------------------
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html login.html index.php;

    # ACME 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    access_log /etc/nginx/rules/access.log combined if=$loggable;
    error_log /etc/nginx/rules/error.log;

    include /etc/nginx/rules/ip_blacklist.conf;
    include /etc/nginx/rules/ua_blacklist.conf;
    include /etc/nginx/rules/token_blacklist.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # ✅ 改用变量：启动时不解析域名 → 面板正常启动
    location @proxy {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $backend_url "https://test-sub.example.com";
        proxy_pass $backend_url;
        
        proxy_set_header Host test-sub.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_ssl_server_name on;
    }

    location ~ /\. {
        deny all;
    }
}
