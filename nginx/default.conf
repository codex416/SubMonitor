# ====================================================
# 日志过滤映射：带 token 参数才记录
# ====================================================
map $arg_token $loggable {
    default 0;
    "~."    1;
}

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    root /var/www/html;
    index index.html login.html index.php;

    # 统一使用容器内的挂载路径（无论是否申请成功，这个路径永远存在，不会导致 Nginx 崩溃）
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ACME 验证目录（供 acme.sh 验证使用）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    access_log /etc/nginx/rules/access.log combined if=$loggable;
    error_log /etc/nginx/rules/error.log;

    include /etc/nginx/rules/ip_blacklist.conf;
    include /etc/nginx/rules/ua_blacklist.conf;
    include /etc/nginx/rules/token_blacklist.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    location @proxy {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $backend_url "https://127.0.0.1";
        proxy_pass $backend_url;
        
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_ssl_server_name on;
    }

    location ~ /\. {
        deny all;
    }
}
