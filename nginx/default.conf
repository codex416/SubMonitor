location /befriends {
        access_log /var/log/nginx/sub_access.log sub_monitor;

        # 防护与限流规则
        include /etc/nginx/rules/ip_blacklist.conf;
        if ($blocked_token = 1) { return 403; }
        if ($blocked_ua = 1) { return 403; }
        limit_req zone=sub_limit burst=5 nodelay;

        # 代理指向 befriends.one（注意结尾不要加斜杠 /）
        proxy_pass https://befriends.one;
        proxy_set_header Host befriends.one;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name befriends.one;

        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_cache off;
    }
