log_format sub_monitor '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.html;

    # 订阅代理入口
    location /api/v1/client/subscribe {
        access_log /var/log/nginx/sub_access.log sub_monitor;

        # 替换 panel.example.com 为你的真实机场域名
        proxy_pass https://befriends.one;
        proxy_set_header Host panel.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # 前端监控看板
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 PHP API
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
