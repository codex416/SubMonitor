# ====================================================
# 日志过滤映射：带 token 参数才记录
# ====================================================
map $arg_token $loggable {
    default 0;
    "~."    1;
}

# ----------------------------------------------------
# 80 端口：处理验证，拦截 IP 或跳转域名
# ----------------------------------------------------
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html login.html index.php;

    # 必须保留：供 acme.sh 自动续签或申请证书验证
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 如果是通过纯 IP 访问 80，直接无任何响应（关闭连接）
    if ($host ~* "^\d+\.\d+\.\d+\.\d+$") {
        return 444; 
    }

    # 正常域名访问则自动跳转 HTTPS
    location / {
        return 301 https://$http_host$request_uri;
    }
}

# ----------------------------------------------------
# 443 端口：加密访问与反向代理
# ----------------------------------------------------
server {
    listen 443 ssl;
    server_name _;

    root /var/www/html;
    index index.html login.html index.php;

    # 核心：如果是通过纯 IP 地址访问 443，直接无任何响应（连接重置）
    if ($host ~* "^\d+\.\d+\.\d+\.\d+$") {
        return 444;
    }

    # 对应 entrypoint.sh 中统一挂载和替换的证书路径[cite: 1, 2]
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    access_log /etc/nginx/rules/access.log combined if=$loggable;
    error_log /etc/nginx/rules/error.log;

    include /etc/nginx/rules/ip_blacklist.conf;
    include /etc/nginx/rules/ua_blacklist.conf;
    include /etc/nginx/rules/token_blacklist.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # 安全的反代配置（已排除未知变量导致崩溃的隐患）
    location @proxy {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $backend_url "https://127.0.0.1";
        proxy_pass $backend_url;
        
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_ssl_server_name on;
    }

    location ~ /\. {
        deny all;
    }
}
