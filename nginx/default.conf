# ----------------------------------------------------
# HTTP 服务：处理 ACME 证书验证及 301 重定向
# ----------------------------------------------------
server {
    listen 80;
    server_name test.befriends.wiki; # 域名更新接口会自动替换此处

    # Let's Encrypt 证书申请验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 自动将 HTTP 请求重定向至 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------
# HTTPS 服务：主应用与 API 反向代理
# ----------------------------------------------------
server {
    listen 443 ssl;
    server_name test.befriends.wiki; # 域名更新接口会自动替换此处

    # SSL 证书文件挂载路径
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # SSL 安全优化参数
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/html;
    index index.php index.html;

    # 引入动态黑名单规则（由 action.php 维护）
    include /etc/nginx/rules/ip_blacklist.conf;
    include /etc/nginx/rules/ua_blacklist.conf;
    include /etc/nginx/rules/token_blacklist.conf;

    # 主站点路由规则
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM 请求转发至后端 submonitor-php 容器
    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # 反向代理与 SNI 节点上报配置（修改反代机场域名的目标区域）
    location /sub/ {
        proxy_pass https://sub.airport.com;
        proxy_set_header Host sub.airport.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 必须保持为 on，不能是域名！
        proxy_ssl_server_name on;
        proxy_ssl_name sub.airport.com;
    }

    # 禁止访问隐藏文件（如 .htaccess, .cert_flag 等）
    location ~ /\. {
        deny all;
    }
}
