server {
    listen 80;
    listen [::]:80;
    server_name test.befriends.wiki; # 👈 修改为你的真实域名

    # 1. ACME HTTP-01 自动化证书申请验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # HTTP 全局重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.befriends.wiki; # 👈 修改为你的真实域名

    # SSL 证书文件位置
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # 安全加密协议设置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/html;
    index index.html index.php;

    # 前端 Dashboard 静态文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP 后端接口处理
    location ~ \.php$ {
        fastcgi_pass submonitor-php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 机场订阅代理接口（包含黑名单防护）
    location /befriends {
        # 引入规则黑名单配置文件
        include /etc/nginx/rules/ip_blacklist.conf;
        include /etc/nginx/rules/ua_blacklist.conf;
        include /etc/nginx/rules/token_blacklist.conf;

        access_log /var/log/nginx/sub_access.log;

        proxy_pass https://befriends.one;
        proxy_set_header Host befriends.one;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name befriends.one;

        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_cache off;
    }
}
