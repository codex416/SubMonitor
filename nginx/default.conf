# ----------------------------------------------------
# 初始默认配置：支持 IP 直接访问，永不因域名崩溃
# ----------------------------------------------------
server {
    listen 80;
    server_name _; # 匹配所有 IP 或未绑定域名的访问

    root /var/www/html;
    index index.php index.html;

    # Let's Encrypt 证书验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 主站点路由
    location / {
        try_files $uri $uri/ @proxy;
    }

    # PHP 处理
    location ~ \.php$ {
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # 反向代理（使用 resolver + 变量，防止后端域名解析失败导致 Nginx 启动崩溃）
    location @proxy {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $backend_target "https://example.com"; # 默认占位符，运行时可被覆盖
        proxy_pass $backend_target;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_ssl_server_name on;
        proxy_ssl_name $http_host;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
