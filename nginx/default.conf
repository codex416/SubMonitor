# ----------------------------------------------------
# HTTP 服务：处理 ACME 证书验证及 301 重定向
# ----------------------------------------------------
server {
    listen 80;
    server_name test.befriends.wiki;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------
# HTTPS 服务：主应用与 API 反向代理
# ----------------------------------------------------
server {
    listen 443 ssl;
    server_name test.befriends.wiki;

    # 解决 400 Bad Request (Request Header Or Cookie Too Large)
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/html;
    index index.php index.html;

    include /etc/nginx/rules/ip_blacklist.conf;
    include /etc/nginx/rules/ua_blacklist.conf;
    include /etc/nginx/rules/token_blacklist.conf;

    # 1. 后台管理面板及 API 路由（明确指定走本地 PHP 处理）
    location ~ ^/(api/|index\.php|assets/) {
        try_files $uri =404;
        fastcgi_pass   submonitor-php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # 2. 根目录下所有其他请求（无缝直接反代到机场，不带 /sub/ 前缀）
    location / {
        proxy_pass https://127.0.0.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_ssl_server_name on;
        proxy_ssl_name 127.0.0.1;
    }

    location ~ /\. {
        deny all;
    }
}
