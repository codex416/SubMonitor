<!-- login.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SubMonitor 登录</title>
    <style>
        body { background: #1a1c24; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; font-family: sans-serif; }
        .login-box { background: #252a36; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <h3>系统登录</h3>
        <input type="password" id="password" placeholder="请输入管理密码">
        <button onclick="handleLogin()">进入控制台</button>
    </div>
    <script>
        function handleLogin() {
            const password = document.getElementById('password').value;
            fetch('/api/login.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'password=' + encodeURIComponent(password)
            }).then(r => r.json()).then(res => {
                if(res.code === 200) window.location.href = '/';
                else alert('密码错误');
            });
        }
    </script>
</body>
</html>
