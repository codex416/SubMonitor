<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubMonitor 订阅监控面板</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .title { font-size: 24px; font-weight: bold; color: var(--accent-blue); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .stat-title { font-size: 13px; color: var(--text-sub); margin-bottom: 5px; }
        .stat-value { font-size: 24px; font-weight: bold; }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .card-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 13px;
        }

        .list-item:last-child { border-bottom: none; }

        .btn-block {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 8px;
        }

        .btn-block:hover { background: var(--accent-red); color: #fff; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th { background: rgba(0,0,0,0.2); color: var(--text-sub); }

        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-200 { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
        .badge-403 { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

        .refresh-btn {
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">🛡️ SubMonitor 订阅防护监控看板</div>
        <button class="refresh-btn" onclick="fetchData()">刷新数据</button>
    </div>

    <!-- 顶部四大统计卡片 -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">总请求次数</div>
            <div class="stat-value" id="total-req">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">独立访问 IP</div>
            <div class="stat-value" id="unique-ip" style="color:var(--accent-blue)">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">成功响应 (200)</div>
            <div class="stat-value" id="success-req" style="color:var(--accent-green)">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">被拦截/异常 (403/429)</div>
            <div class="stat-value" id="blocked-req" style="color:var(--accent-red)">0</div>
        </div>
    </div>

    <!-- 多维度分析卡片 -->
    <div class="analysis-grid">
        <div class="card">
            <div class="card-header">🔥 高频访问 IP (TOP 5)</div>
            <div id="top-ips">拉取中...</div>
        </div>
        <div class="card">
            <div class="card-header">🔑 高频使用 Token (TOP 5)</div>
            <div id="top-tokens">拉取中...</div>
        </div>
    </div>

    <!-- 实时访问日志列表 -->
    <div class="card">
        <div class="card-header">📝 实时订阅访问日志</div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>IP 地址</th>
                        <th>归属地</th>
                        <th>Token</th>
                        <th>状态</th>
                        <th>客户端 (UA)</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="log-table">
                    <tr><td colspan="7">数据加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function blockTarget(type, value) {
            if (!confirm(`确定要封禁该 ${type.toUpperCase()} (${value}) 吗？`)) return;

            const action = type === 'ip' ? 'block_ip' : 'block_token';
            const formData = new FormData();
            formData.append('target', value);

            try {
                const res = await fetch(`/api/action.php?action=${action}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                alert(data.msg);
                fetchData();
            } catch (e) {
                alert('操作失败，请重试');
            }
        }

        async function fetchData() {
            try {
                const res = await fetch('/api/logs.php');
                const logs = await res.json();

                // 统计计算
                document.getElementById('total-req').innerText = logs.length;
                
                const ips = [...new Set(logs.map(l => l.ip))];
                document.getElementById('unique-ip').innerText = ips.length;

                const success = logs.filter(l => l.status === '200').length;
                document.getElementById('success-req').innerText = success;

                const blocked = logs.filter(l => l.status !== '200').length;
                document.getElementById('blocked-req').innerText = blocked;

                // TOP IP 统计
                const ipCounts = {};
                logs.forEach(l => ipCounts[l.ip] = (ipCounts[l.ip] || 0) + 1);
                const sortedIPs = Object.entries(ipCounts).sort((a,b) => b[1] - a[1]).slice(0, 5);
                
                document.getElementById('top-ips').innerHTML = sortedIPs.map(([ip, count]) => `
                    <div class="list-item">
                        <span><strong>${ip}</strong> (${count} 次)</span>
                        <button class="btn-block" onclick="blockTarget('ip', '${ip}')">🚫 封禁 IP</button>
                    </div>
                `).join('') || '暂无数据';

                // TOP Token 统计
                const tokenCounts = {};
                logs.forEach(l => {
                    if (l.token && l.token !== '-') tokenCounts[l.token] = (tokenCounts[l.token] || 0) + 1;
                });
                const sortedTokens = Object.entries(tokenCounts).sort((a,b) => b[1] - a[1]).slice(0, 5);

                document.getElementById('top-tokens').innerHTML = sortedTokens.map(([token, count]) => `
                    <div class="list-item">
                        <span><strong>${token.substring(0, 10)}...</strong> (${count} 次)</span>
                        <button class="btn-block" onclick="blockTarget('token', '${token}')">🚫 封禁 Token</button>
                    </div>
                `).join('') || '暂无数据';

                // 日志表格渲染
                const tbody = document.getElementById('log-table');
                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7">暂无日志数据</td></tr>';
                    return;
                }

                tbody.innerHTML = logs.map(l => `
                    <tr>
                        <td>${l.time}</td>
                        <td>${l.ip}</td>
                        <td>${l.ip_info}</td>
                        <td><code>${l.token !== '-' ? l.token.substring(0,8)+'...' : '-'}</code></td>
                        <td><span class="badge ${l.status === '200' ? 'badge-200' : 'badge-403'}">${l.status}</span></td>
                        <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${l.ua}</td>
                        <td>
                            <button class="btn-block" onclick="blockTarget('ip', '${l.ip}')">封IP</button>
                            ${l.token !== '-' ? `<button class="btn-block" onclick="blockTarget('token', '${l.token}')">封Token</button>` : ''}
                        </td>
                    </tr>
                `).join('');

            } catch (e) {
                console.error(e);
            }
        }

        fetchData();
        setInterval(fetchData, 10000); // 10秒自动刷新
    </script>
</body>
</html>
