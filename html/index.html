<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanHua-VPN 管理面板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f6f9;
        }
        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .main-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            background: #fff;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }
        .nav-pills .nav-link {
            color: #555;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 500;
        }
        .nav-pills .nav-link.active {
            background-color: var(--primary-color);
        }
        .status-badge {
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        .status-box {
            border-radius: 8px;
            padding: 12px 16px;
            background-color: #f8f9fa;
            border-left: 4px solid var(--primary-color);
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card main-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="m-0 text-primary"><i class="bi bi-shield-lock-fill me-2"></i>FanHua-VPN 管理面板</h3>
                    <span id="system-status" class="badge bg-secondary status-badge">检查服务状态中...</span>
                </div>

                <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="pills-domain-tab" data-bs-toggle="pill" data-bs-target="#pills-domain" type="button" role="tab">
                            <i class="bi bi-globe me-1"></i> 域名与证书配置
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="pills-nodes-tab" data-bs-toggle="pill" data-bs-target="#pills-nodes" type="button" role="tab" onclick="loadNodes()">
                            <i class="bi bi-hdd-network me-1"></i> 节点配置管理
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="pills-tabContent">
                    <!-- 域名与证书配置页 -->
                    <div class="tab-pane fade show active" id="pills-domain" role="tabpanel">
                        <div class="mb-4">
                            <h5><i class="bi bi-link-45deg me-2"></i>自定义代理域名</h5>
                            <p class="text-muted small">设置自定义域名并自动申请 Let's Encrypt SSL 证书，请确保域名已解析到本服务器 IP。</p>
                            
                            <div class="input-group mb-3">
                                <span class="input-group-text">https://</span>
                                <input type="text" id="domain-input" class="form-control" placeholder="例如: vpn.yourdomain.com">
                                <button class="btn btn-primary" type="button" onclick="submitDomainCert()">
                                    <i class="bi bi-arrow-repeat me-1"></i> 更新域名并申请证书
                                </button>
                            </div>

                            <div id="cert-status-box" class="status-box" style="display: none;"></div>
                        </div>
                    </div>

                    <!-- 节点管理页 -->
                    <div class="tab-pane fade" id="pills-nodes" role="tabpanel">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="m-0"><i class="bi bi-list-task me-2"></i>节点列表</h5>
                            <button class="btn btn-sm btn-outline-primary" onclick="loadNodes()">
                                <i class="bi bi-arrow-clockwise"></i> 刷新
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>节点名称</th>
                                        <th>地址 / 端口</th>
                                        <th>协议类型</th>
                                        <th>状态</th>
                                    </tr>
                                </thead>
                                <tbody id="nodes-list">
                                    <tr>
                                        <td colspan="4" class="text-center text-muted">正在加载节点数据...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Toast 提示容器 -->
<div class="toast-container" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let certPollTimer = null;

    // HTML 转义辅助函数
    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // 显示 Toast 提示
    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toastEl = document.createElement('div');
        toastEl.className = `toast align-items-center text-white bg-${type === 'error' ? 'danger' : type === 'success' ? 'success' : 'primary'} border-0 show`;
        toastEl.setAttribute('role', 'alert');
        toastEl.setAttribute('aria-live', 'assertive');
        toastEl.setAttribute('aria-atomic', 'true');
        
        toastEl.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">${escapeHtml(message)}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        `;
        
        container.appendChild(toastEl);
        setTimeout(() => {
            toastEl.remove();
        }, 3000);
    }

    // 页面初始化：获取当前域名及证书申请状态
    async function initDomainStatus() {
        try {
            const res = await fetch('/api/action.php?action=get_domain');
            const data = await res.json();
            
            if (data) {
                if (data.domain) {
                    document.getElementById('domain-input').value = data.domain;
                }
                if (data.cert_status) {
                    renderCertStatus(data.cert_status);
                }
                // 更新顶部服务状态
                const systemStatus = document.getElementById('system-status');
                systemStatus.className = 'badge bg-success status-badge';
                systemStatus.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> 服务运行正常';
            }
        } catch (e) {
            const systemStatus = document.getElementById('system-status');
            systemStatus.className = 'badge bg-danger status-badge';
            systemStatus.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i> 服务连接异常';
        }
    }

    // 渲染证书状态组件
    function renderCertStatus(certStatus) {
        const statusBox = document.getElementById('cert-status-box');
        statusBox.style.display = 'block';

        if (certStatus.status === 'processing') {
            statusBox.className = 'status-box text-warning';
            statusBox.innerHTML = `⏱️ ${escapeHtml(certStatus.msg || '正在申请证书中...')}`;
        } else if (certStatus.status === 'success') {
            statusBox.className = 'status-box text-success';
            statusBox.innerHTML = `✅ ${escapeHtml(certStatus.msg || '证书申请并安装成功！')}`;
        } else if (certStatus.status === 'error') {
            statusBox.className = 'status-box text-danger';
            statusBox.innerHTML = `❌ ${escapeHtml(certStatus.msg || '证书申请失败，请检查配置或域名解析')}`;
        } else {
            statusBox.style.display = 'none';
        }
    }

    // 提交域名并申请证书（含轮询机制）
    async function submitDomainCert() {
        const domainInput = document.getElementById('domain-input');
        const statusBox = document.getElementById('cert-status-box');
        const domain = domainInput.value.trim();

        if (!domain) {
            showToast('请输入有效的域名', 'error');
            return;
        }

        // 清除上一次的轮询定时器
        if (certPollTimer) clearInterval(certPollTimer);

        statusBox.style.display = 'block';
        statusBox.className = 'status-box text-primary';
        statusBox.innerHTML = '⏱️ 正在提交域名配置并准备申请...';

        try {
            // 1. 提交配置请求
            const res = await fetch('/api/action.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'apply_cert', domain: domain })
            });
            const data = await res.json();

            if (data.status === 'success') {
                showToast('配置提交成功，开始申请证书', 'success');
                statusBox.className = 'status-box text-warning';
                statusBox.innerHTML = `⏱️ 域名已更新为 <strong>${escapeHtml(domain)}</strong>，正在向 Let's Encrypt 申请 SSL 证书，请稍候...`;

                // 2. 开启轮询追踪后台脚本申请进度
                let checkCount = 0;
                certPollTimer = setInterval(async () => {
                    checkCount++;
                    // 60秒超时保护
                    if (checkCount > 30) {
                        clearInterval(certPollTimer);
                        statusBox.className = 'status-box text-danger';
                        statusBox.innerHTML = '⚠️ 申请超时，请刷新页面检查后台状态';
                        return;
                    }

                    try {
                        const statusRes = await fetch('/api/action.php?action=get_domain');
                        const statusData = await statusRes.json();

                        if (statusData && statusData.cert_status) {
                            const certStatus = statusData.cert_status;

                            if (certStatus.status === 'processing') {
                                statusBox.className = 'status-box text-warning';
                                statusBox.innerHTML = `⏱️ ${escapeHtml(certStatus.msg || '正在申请证书中...')}`;
                            } else if (certStatus.status === 'success') {
                                clearInterval(certPollTimer);
                                statusBox.className = 'status-box text-success';
                                statusBox.innerHTML = `✅ ${escapeHtml(certStatus.msg || '证书申请并安装成功！')}`;
                                showToast('SSL证书申请成功并已生效！', 'success');
                            } else if (certStatus.status === 'error') {
                                clearInterval(certPollTimer);
                                statusBox.className = 'status-box text-danger';
                                statusBox.innerHTML = `❌ ${escapeHtml(certStatus.msg || '证书申请失败，请检查解析')}`;
                                showToast('证书申请失败', 'error');
                            }
                        }
                    } catch (e) {
                        // 忽略轮询网络抖动
                    }
                }, 2000);

            } else {
                statusBox.className = 'status-box text-danger';
                statusBox.innerHTML = `❌ 提交失败: ${escapeHtml(data.message || '系统错误')}`;
                showToast(data.message || '提交失败', 'error');
            }
        } catch (err) {
            statusBox.className = 'status-box text-danger';
            statusBox.innerHTML = '❌ 请求出错，请检查网络或 API 接口通信';
            showToast('请求接口失败', 'error');
        }
    }

    // 加载节点列表
    async function loadNodes() {
        const listBody = document.getElementById('nodes-list');
        listBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">正在加载节点数据...</td></tr>';

        try {
            const res = await fetch('/api/action.php?action=get_nodes');
            const data = await res.json();

            if (Array.isArray(data) && data.length > 0) {
                listBody.innerHTML = data.map(node => `
                    <tr>
                        <td><strong>${escapeHtml(node.name || '未命名节点')}</strong></td>
                        <td>${escapeHtml(node.server || '-')}:${escapeHtml(node.port || '-')}</td>
                        <td><span class="badge bg-info text-dark">${escapeHtml(node.type || 'vless')}</span></td>
                        <td><span class="badge bg-success">在线</span></td>
                    </tr>
                `).join('');
            } else {
                listBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">暂无节点信息</td></tr>';
            }
        } catch (e) {
            listBody.innerHTML = '<tr><td colspan="4" class="text-center text-danger">加载节点失败</td></tr>';
        }
    }

    // 页面加载完成执行
    document.addEventListener('DOMContentLoaded', () => {
        initDomainStatus();
    });
</script>
</body>
</html>
